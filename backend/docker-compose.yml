# Local PostgreSQL for development. Run from this directory:
#   docker compose up -d
# Reads DB_* values from backend/.env.
services:
  db:
    image: postgres:17
    container_name: pug-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pug_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env (copy .env.example)}
      POSTGRES_DB: ${DB_NAME:-pug}
    ports:
      # Bound to localhost only so the database is not reachable from the network.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pug-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pug-pgdata:
    name: pug-pgdata
